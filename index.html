<!doctype html>
<html lang="en">
<head>
	<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
	<title>Chikitsak</title>
	<link rel="stylesheet" href="/src/styles.css">
</head>
<body class="h-dvh grid grid-rows-[auto_1fr] bg-slate-50 text-slate-900 antialiased dark:bg-slate-950 dark:text-slate-100">
	<header class="flex flex-wrap items-center gap-x-4 gap-y-2 border-b border-slate-200 bg-white/80 px-5 py-3 backdrop-blur dark:border-slate-800 dark:bg-slate-900/80">
		<div class="flex items-center gap-2.5">
			<div class="grid size-8 place-items-center rounded-lg bg-teal-600 text-white shadow-sm">
				<svg viewBox="0 0 24 24" class="size-5" fill="currentColor" aria-hidden="true"><path d="M10 3h4v7h7v4h-7v7h-4v-7H3v-4h7z"/></svg>
			</div>
			<div><div class="font-semibold leading-tight tracking-tight">Chikitsak</div><div class="text-xs text-slate-500 dark:text-slate-400">Family health assistant · not a substitute for a doctor</div></div>
		</div>
		<label class="ml-auto flex items-center gap-2 text-xs text-slate-500 dark:text-slate-400">Household
			<input id="hh" size="16" class="rounded-md border border-slate-200 bg-slate-50 px-2.5 py-1.5 font-mono text-sm text-slate-900 outline-none focus:border-teal-500 focus:ring-2 focus:ring-teal-500/20 dark:border-slate-700 dark:bg-slate-800 dark:text-slate-100">
		</label>
	</header>
	<div class="grid min-h-0 grid-rows-[1fr_auto_auto] md:grid-cols-[1fr_320px] md:grid-rows-[1fr_auto]">
		<div id="log" class="flex min-h-0 flex-col gap-3 overflow-y-auto px-4 py-6 md:px-8"></div>
		<form id="f" class="flex gap-2 border-t border-slate-200 bg-white p-3 md:col-start-1 md:px-8 dark:border-slate-800 dark:bg-slate-900">
			<input id="text" autocomplete="off" maxlength="2000" placeholder="Tell me who is unwell and what's going on…"
				class="min-w-0 flex-1 rounded-xl border border-slate-200 bg-slate-50 px-4 py-2.5 outline-none focus:border-teal-500 focus:ring-2 focus:ring-teal-500/20 dark:border-slate-700 dark:bg-slate-800">
			<button id="send" class="rounded-xl bg-teal-600 px-5 font-medium text-white shadow-sm hover:bg-teal-700 disabled:opacity-50">Send</button>
		</form>
		<aside id="mem" class="max-h-[30vh] overflow-y-auto border-t border-slate-200 bg-white p-4 text-sm md:col-start-2 md:row-span-2 md:row-start-1 md:max-h-none md:border-t-0 md:border-l dark:border-slate-800 dark:bg-slate-900"></aside>
	</div>
<script type="module">
	const $ = (id) => document.getElementById(id), hh = () => $("hh").value.trim() || "demo";
	const esc = (t) => String(t).replace(/[&<>"]/g, (c) => `&#${c.charCodeAt(0)};`);
	const TAG = { EMERGENCY: "bg-red-100 text-red-700 dark:bg-red-950 dark:text-red-300", DOCTOR: "bg-amber-100 text-amber-800 dark:bg-amber-950 dark:text-amber-300",
		HOME: "bg-emerald-100 text-emerald-700 dark:bg-emerald-950 dark:text-emerald-300", NEED_INFO: "bg-slate-100 text-slate-600 dark:bg-slate-800 dark:text-slate-300" };
	const BUBBLE = { EMERGENCY: "border-l-4 border-l-red-500 bg-red-50 dark:bg-red-950/40", DOCTOR: "border-l-4 border-l-amber-500 bg-amber-50 dark:bg-amber-950/30" };
	const tag = (o, text) => `<span class="inline-block rounded-full px-2 py-0.5 font-mono text-[11px] font-semibold tracking-wide ${TAG[o] ?? TAG.NEED_INFO}">${esc(text)}</span>`;
	const EXAMPLES = ["My son Aarav (4) has had a fever since last night.", "My dad is 72, diabetic, and has felt dizzy for 4 days.", "Is turmeric milk good for a cold?"];

	function empty() {
		$("log").innerHTML = `<div class="m-auto max-w-md text-center"><h2 class="text-xl font-semibold">How is everyone feeling?</h2>
			<p class="mt-1 text-slate-500 dark:text-slate-400">Ask about anyone in the family. I'll keep track of who's who.</p>
			<div class="mt-5 grid gap-2">${EXAMPLES.map((e) => `<button class="chip rounded-xl border border-slate-200 bg-white px-4 py-2.5 text-left shadow-sm hover:border-teal-500 dark:border-slate-700 dark:bg-slate-900">${esc(e)}</button>`).join("")}</div></div>`;
		document.querySelectorAll(".chip").forEach((b) => (b.onclick = () => send(b.textContent)));
	}
	function add(html, cls) {
		$("log").querySelector(".m-auto")?.remove();
		const d = document.createElement("div");
		d.className = `max-w-[min(68ch,85%)] whitespace-pre-wrap rounded-2xl px-4 py-2.5 shadow-sm ${cls}`;
		d.innerHTML = html; $("log").append(d); d.scrollIntoView({ behavior: "smooth", block: "end" }); return d;
	}
	const bot = (cls = "") => `self-start rounded-bl-md border border-slate-200 bg-white dark:border-slate-800 dark:bg-slate-900 ${cls}`;

	async function refresh() {
		const s = await fetch(`/h/${encodeURIComponent(hh())}/state`).then((r) => r.json()).catch(() => null);
		if (!s?.members) return;
		const card = (body) => `<div class="mb-2 rounded-xl border border-slate-200 p-3 dark:border-slate-800">${body}</div>`;
		const sub = (t) => `<div class="mt-0.5 break-words text-xs text-slate-500 dark:text-slate-400">${esc(t)}</div>`;
		const head = (t) => `<h3 class="mb-2 mt-5 text-[11px] font-semibold uppercase tracking-widest text-slate-400 first:mt-0">${t}</h3>`;
		const none = (t) => `<p class="text-slate-400">${t}</p>`;
		const members = Object.values(s.members).map((m) => { const extra = [...m.conditions, ...m.meds, ...m.allergies];
			return card(`<b>${esc(m.name)}</b> <span class="text-slate-500 dark:text-slate-400">· ${esc(m.relation)}${m.age != null ? ` · ${m.age}y` : ""}</span>${extra.length ? sub(extra.join(", ")) : ""}`); });
		const episodes = Object.values(s.episodes).reverse().map((e) => card(`<div class="flex items-start justify-between gap-2"><b>${esc(e.title)}</b>${tag(e.outcome, e.status.replace("_", " "))}</div>`
			+ sub(`${s.members[e.memberId]?.name ?? e.memberId} · ${Object.entries(e.facts).map(([k, v]) => `${k.replace("_", " ")}: ${v}`).join(", ") || "no details yet"}`)));
		$("mem").innerHTML = head("Family") + (members.join("") || none("No one yet")) + head("Episodes") + (episodes.join("") || none("None yet"));
	}

	async function send(text) {
		add(esc(text), "self-end rounded-br-md bg-teal-600 text-white");
		const wait = add('<span class="flex gap-1 py-1">' + [0, 150, 300].map((d) => `<span class="size-1.5 animate-bounce rounded-full bg-slate-400" style="animation-delay:${d}ms"></span>`).join("") + "</span>", bot());
		$("send").disabled = true;
		try {
			const res = await fetch(`/h/${encodeURIComponent(hh())}/chat`, { method: "POST", headers: { "content-type": "application/json" }, body: JSON.stringify({ text }) });
			const r = await res.json(); wait.remove();
			if (!r.reply) throw new Error(r.error ?? res.statusText);
			add((r.outcome ? tag(r.outcome, [r.outcome.replace("_", " "), r.memberId].filter(Boolean).join(" · ")) + "<br>" : "") + esc(r.reply), bot(BUBBLE[r.outcome]));
		} catch (e) { wait.remove(); add(`Something went wrong: ${esc(e.message)}`, bot("text-red-600 dark:text-red-400")); }
		$("send").disabled = false; refresh();
	}

	$("hh").value = location.hash.slice(1) || "family-" + Math.random().toString(36).slice(2, 6);
	location.hash = hh();
	$("hh").onchange = () => { location.hash = hh(); empty(); refresh(); };
	$("f").onsubmit = (ev) => { ev.preventDefault(); const t = $("text").value.trim(); if (t) { $("text").value = ""; send(t); } };
	empty(); refresh();
</script>
</body>
</html>
